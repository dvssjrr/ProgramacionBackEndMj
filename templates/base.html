{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestión de proyectos y tareas para equipos que quieren avanzar.">
    <title>{% block title %}Nexo{% endblock %} | Nexo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <nav class="nav container" aria-label="Navegación principal">
            <a class="brand" href="{% url 'home' %}"><span class="brand-mark">N</span> NEXO</a>
            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-menu">Menú</button>
            <div class="nav-links" id="main-menu">
                <a class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">Inicio</a>
                <a class="{% if request.resolver_match.url_name == 'about' %}active{% endif %}" href="{% url 'about' %}">Quiénes somos</a>
                <a class="{% if request.resolver_match.url_name == 'services' %}active{% endif %}" href="{% url 'services' %}">Servicios</a>
                <a class="{% if request.resolver_match.url_name == 'contact' %}active{% endif %}" href="{% url 'contact' %}">Contacto</a>
            </div>
        </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="site-footer">
        <div class="container footer-content">
            <div><a class="brand footer-brand" href="{% url 'home' %}"><span class="brand-mark">N</span> NEXO</a><p>Claridad para cada proyecto.</p></div>
            <div class="footer-meta"><span>© {% now "Y" %} Nexo</span><a href="{% url 'contact' %}">Hablemos</a></div>
        </div>
    </footer>
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
