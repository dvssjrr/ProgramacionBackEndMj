<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Gestión Académica{% endblock %}</title>
    <!-- Bootstrap aporta la estructura responsive y los componentes visuales. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos compartidos: paleta roja y estados visuales del sistema. -->
    <style>
        :root { --academic-red: #b42318; --academic-dark: #73140e; }
        body { background: #fff8f7 !important; color: #32110e; }
        .navbar { background: linear-gradient(135deg, var(--academic-dark), var(--academic-red)) !important; }
        .navbar-brand { font-weight: 700; letter-spacing: .03em; }
        .academic-navigation { position: relative; display: flex; flex-direction: column; align-items: flex-start; padding: 1rem 0; }
        .admin-link { position: absolute; top: 1rem; right: 0; color: #fff; border: 1px solid rgba(255, 255, 255, .7); border-radius: .35rem; padding: .4rem .75rem; text-decoration: none; font-size: .9rem; }
        .admin-link:hover { color: #fff; background: rgba(255, 255, 255, .15); }
        .academic-links { display: flex; flex-direction: row; flex-wrap: wrap; gap: .35rem; width: 100%; padding-top: .75rem; border-top: 1px solid rgba(255, 255, 255, .35); }
        .academic-links .nav-link { border-radius: .35rem; padding: .45rem .75rem; }
        .academic-links .nav-link:hover { background: rgba(255, 255, 255, .15); }
        .btn-primary { background-color: var(--academic-red); border-color: var(--academic-red); }
        .btn-primary:hover, .btn-primary:focus { background-color: var(--academic-dark); border-color: var(--academic-dark); }
        .btn-outline-primary { color: var(--academic-red); border-color: var(--academic-red); }
        .btn-outline-primary:hover { background-color: var(--academic-red); border-color: var(--academic-red); }
        .table thead { background-color: var(--academic-red); color: #fff; }
        .table thead th { border-color: var(--academic-red); }
        .academic-panel { border: 0; border-top: 5px solid var(--academic-red); box-shadow: 0 .5rem 1.5rem rgba(115, 20, 14, .1); }
        .form-control:focus, .form-select:focus { border-color: var(--academic-red); box-shadow: 0 0 0 .2rem rgba(180, 35, 24, .15); }
        .nav-link.active { color: #fff !important; font-weight: 700; }
    </style>
</head>
<body class="bg-light">
    <!-- Menú común para acceder a cada módulo CRUD. -->
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container academic-navigation">
            <a class="navbar-brand" href="{% url 'academic_courses' %}">Gestión Académica</a>
            <!-- Acceso al panel administrativo protegido por Django. -->
            <a class="admin-link" href="{% url 'admin:index' %}">Panel administrativo</a>
            <div class="navbar-nav academic-links">
                <a class="nav-link" href="{% url 'academic_teachers' %}">Docentes</a>
                <a class="nav-link" href="{% url 'academic_courses' %}">Asignaturas</a>
                <a class="nav-link" href="{% url 'academic_students' %}">Estudiantes</a>
                <a class="nav-link" href="{% url 'academic_enrollments' %}">Inscripciones</a>
            </div>
        </div>
    </nav>
    <!-- Cada página inserta aquí su contenido específico. -->
    <main class="container pb-5">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
