<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Página no encontrada</title>
    <!-- Bootstrap conserva el mismo estilo visual de la interfaz principal. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Mensaje simple para URLs que no pertenecen al sistema académico. -->
    <main class="container py-5 text-center">
        <p class="text-uppercase fw-bold text-danger mb-2">Error 404</p>
        <h1 class="display-4">Página no encontrada</h1>
        <p class="lead">La dirección que intentas visitar no existe o fue movida.</p>
        <a class="btn btn-primary" href="{% url 'home' %}">Volver a cursos</a>
    </main>
</body>
</html>
