{% if items.has_other_pages %}<nav class="pagination" aria-label="Paginación">
  {% if items.has_previous %}<a class="btn btn-outline btn-small" href="?page={{ items.previous_page_number }}">← Anterior</a>{% endif %}
  <span>Página {{ items.number }} de {{ items.paginator.num_pages }}</span>
  {% if items.has_next %}<a class="btn btn-outline btn-small" href="?page={{ items.next_page_number }}">Siguiente →</a>{% endif %}
</nav>{% endif %}
